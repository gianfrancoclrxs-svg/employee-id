<style>
  :root{--red:#c8101c;--deep:#8f0a13;--gold:#e8a91c;--ink:#1a1a1a;--muted:#6b6b6b;--paper:#faf7f0;--line:#e7e1d3}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:28px 16px 40px;
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(ellipse at 50% -10%, #3a0c11 0%, #170a0c 55%, #0d0607 100%);
    background-attachment:fixed}
  .wrap{width:100%;max-width:420px}
  .id{background:var(--paper);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.55);overflow:hidden}
  .head{background:linear-gradient(180deg,var(--red),var(--deep));padding:30px 20px;text-align:center}
  .head img{width:170px;max-width:65%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));animation:fade .6s ease both}
  .stripe{height:4px;background:var(--gold)}
  .body{padding:26px 24px 22px}
  .name{font-size:26px;font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
  .pos{margin-top:6px;color:var(--red);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em}
  .items{margin-top:18px}
  .item{padding:12px 0;border-top:1px solid var(--line)}
  .k{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .v{font-weight:600;font-size:15.5px;margin-top:3px;word-break:break-word}
  .v a{color:var(--ink);text-decoration:none}
  .v a:hover{color:var(--red)}
  .sos{margin-top:22px;padding:4px 16px 6px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:12px}
  .sos h3{margin:12px 0 0;font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.12em}
  .sos .items{margin-top:6px}
  .sos .item:first-child{border-top:0}
  .social{display:flex;justify-content:center;gap:12px;margin-top:24px}
  .social a{width:46px;height:46px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
  .social a:hover{background:var(--red);transform:translateY(-2px)}
  svg{width:21px;height:21px;fill:#fff}
  .foot{background:#121212;color:#b9b2a2;text-align:center;padding:13px;font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .state{background:var(--paper);border-radius:16px;padding:30px;text-align:center;font-weight:600}
  .sk{background:linear-gradient(90deg,#ebe5d6 25%,#f6f2e8 50%,#ebe5d6 75%);background-size:200% 100%;animation:shine 1.3s linear infinite;border-radius:10px}
  .sk-head{height:120px;background:linear-gradient(90deg,#8f0a13 25%,#b30f1b 50%,#8f0a13 75%);background-size:200% 100%;animation:shine 1.3s linear infinite}
  @keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .body{animation:fade .5s ease both}
</style>
</head>

const IG_SVG = '<svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM17.2 5.8a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2z"/></svg>';

function safeUrl(u) {
  if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; }
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}
function item(label, value, href) {
  const d = el("div", "item");
  const v = el("div", "v");
  if (href) { const a = el("a", "", value); a.href = href; v.appendChild(a); } else v.textContent = value;
  d.append(el("div", "k", label), v);
  return d;
}
function state(msg) { root.innerHTML = ""; root.appendChild(el("div", "state", msg)); }

(async () => {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) return state("Invalid link.");
  const timer = setTimeout(() => state("Taking too long. Check your internet or Firebase config."), 12000);
  try {
    const snap = await getDoc(doc(db, "employees", id));
    clearTimeout(timer);
    if (!snap.exists()) return state("Employee not found.");
    const e = snap.data();
    document.title = e.name + " | K3B Lucky's";

    const card = el("div", "id");

    const head = el("div", "head");
    const logo = new Image(); logo.src = LOGO; logo.alt = "K3B Lucky's";
    head.appendChild(logo);
    card.append(head, el("div", "stripe"));

    const body = el("div", "body");
    body.append(el("h1", "name", e.name), el("div", "pos", e.position));

    const items = el("div", "items");
    items.append(
      item("Employee ID no.", e.empNo),
      item("Contact number", e.contact, "tel:" + e.contact),
      item("Email", e.email, "mailto:" + e.email));
    body.appendChild(items);

    const sos = el("div", "sos");
    sos.appendChild(el("h3", "", "Emergency contact"));
    const si = el("div", "items");
    si.append(
      item("Name", e.emName),
      item("Number", e.emNumber, "tel:" + e.emNumber),
      item("Address", e.emAddress));
    sos.appendChild(si);
    body.appendChild(sos);

    const fb = safeUrl(e.fb), ig = safeUrl(e.ig);
    if (fb || ig) {
      const s = el("div", "social");
      [[fb, FB_SVG, "Facebook"], [ig, IG_SVG, "Instagram"]].forEach(([url, svg, label]) => {
        if (!url) return;
        const a = el("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.ariaLabel = label;
        a.innerHTML = svg; s.appendChild(a);
      });
      body.appendChild(s);
    }

    card.append(body, el("div", "foot", "K3B Lucky's Diner"));
    root.innerHTML = "";
    root.appendChild(card);
  } catch (err) {
    clearTimeout(timer);
    console.error(err);
    state("Could not load employee.");
  }
})();
</script>
</body>
</html>
